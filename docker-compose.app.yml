version: "3.8"

services:
  backend:
    image: pirivoice-${ENV_NAME}-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      # 🚨 DATABASE_URL/REDIS_URL ต้องชี้ host ตาม ENV_NAME เสมอ
      #    (host ของ Postgres/Redis ใน Swarm = ${ENV_NAME}_infra_db / ${ENV_NAME}_infra_redis)
      #    override ตรงนี้ → เปลี่ยน ENV_NAME ใน .env แล้วระบบชี้ service ตัวใหม่ให้อัตโนมัติ
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${ENV_NAME}_infra_db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://${ENV_NAME}_infra_redis:6379/0
      - IMPORT_STORAGE_DIR=/data/imports
    volumes:
      - imports_data:/data/imports
    networks:
      - shared_network
      - traefik-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${ENV_NAME}_backend.rule=Host(`${API_DOMAIN}`)"
        - "traefik.http.services.${ENV_NAME}_backend.loadbalancer.server.port=8000"
        - "traefik.docker.network=traefik-public"

  frontend:
    image: pirivoice-${ENV_NAME}-frontend:${IMAGE_TAG:-latest}
    networks:
      - traefik-public
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${ENV_NAME}_frontend.rule=Host(`${WEB_DOMAIN}`)"
        - "traefik.http.services.${ENV_NAME}_frontend.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik-public"

  # 🏭 ARQ Worker: ประมวลผลงาน Import นักเรียนจาก Excel (คิวงานแบบ Async)
  # - อ่านไฟล์ .xlsx จาก shared volume (imports_data เดียวกับ backend ที่อัปโหลด)
  # - max_jobs=1 → ประมวลผลทีละงาน กันชนกันสร้างข้อมูลซ้ำ
  worker:
    image: pirivoice-${ENV_NAME}-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${ENV_NAME}_infra_db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://${ENV_NAME}_infra_redis:6379/0
      - IMPORT_STORAGE_DIR=/data/imports
    volumes:
      - imports_data:/data/imports
    networks:
      - shared_network
    command: ["python", "-m", "arq", "workers.import_worker.WorkerSettings"]
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first

  # 📲 ARQ Worker: ส่ง Web Push (A3) — cron ทุก 20 วินาที + cleanup วันละครั้ง
  # ⭐ แยก service จาก `worker` ข้างบนโดยเจตนา: `worker` ตั้ง max_jobs=1 + job_timeout=3600
  #    ⇒ ถ้ารวมกัน import นักเรียนตอนเปิดเทอมจะบล็อก push ทั้งชั่วโมง (ดู workers/push_worker.py)
  # ⚠️ ไม่มี volume — push worker ไม่แตะไฟล์เลย (อ่าน/เขียน DB อย่างเดียว)
  #    แต่ต้องออก HTTPS ได้ เพราะยิงไป FCM/APNs (network `shared_network` มี gateway ออกเน็ตอยู่แล้ว)
  push_worker:
    image: pirivoice-${ENV_NAME}-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${ENV_NAME}_infra_db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://${ENV_NAME}_infra_redis:6379/0
    networks:
      - shared_network
    command: ["python", "-m", "arq", "workers.push_worker.WorkerSettings"]
    deploy:
      # replicas 1 — ยังไม่ต้องมากกว่านี้: throughput ของ cron 20 วิ × batch 100
      # = 300 ข้อความ/นาที ซึ่งเกินความต้องการของโรงเรียนมาก
      # ⚠️ ถ้าจะเพิ่ม replica ในอนาคต ต้องรู้ว่า `FOR UPDATE SKIP LOCKED` รองรับอยู่แล้ว
      #    แต่ `unique=True` ของ ARQ cron จะทำให้มีตัวเดียวได้ cron — ตัวอื่นว่าง
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first

volumes:
  # Shared volume เก็บไฟล์ .xlsx ที่อัปโหลด — backend เขียน, worker อ่าน
  # (ตั้งชื่อตาม ENV_NAME → staging/production ใช้คนละ volume กัน)
  imports_data:
    name: ${ENV_NAME}_imports_data

networks:
  traefik-public:
    external: true
  shared_network:
    name: app-internal-${ENV_NAME}
    external: true
