<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/logos/school-logo.png">
    <!--
      🔤 ไอคอน: โหลดจาก npm ทางเดียว (`main.css` บรรทัดแรก) — **ห้ามเพิ่ม CDN กลับ**
         ของเดิมโหลดซ้ำ 2 ทาง (CDN 1.11.3 ที่นี่ + npm 1.13.1 ใน `main.css`)
         ⇒ ดาวน์โหลดฟอนต์ไอคอนทั้งชุดสองรอบ และเวอร์ชันชนกันแบบไม่ตั้งใจ
    -->

    <!--
      📱 `viewport-fit=cover` จำเป็นสำหรับ `env(safe-area-inset-*)`
         ถ้าไม่ใส่ เบราว์เซอร์จะคืนค่า safe-area เป็น **0 ทุกด้าน** ⇒ ทั้งแถบล่าง หัวแถบ
         และ `.pb-safe` ที่เขียนรอไว้แล้วไม่มีผลจริงบน iPhone ที่มีรอยบาก
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PIRIvoice — ระบบแจ้งเรื่องของนักเรียน สภานักเรียน พิริยาลัยจังหวัดแพร่</title>

    <!-- 🔤 Font: Noto Sans Thai (body) + Anuphan (display/พาดหัว) — preconnect + display=swap กัน FOUT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&family=Anuphan:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- 🔍 SEO — คีย์เวิร์ดหลักที่ใช้ค้นหา (ภาษาไทย + อังกฤษ): PIRIvoice / Pirivoice / เสียงจากชาวพิริยาลัย / สภานักเรียน -->
    <meta name="description" content="PIRIvoice (เสียงจากชาวพิริยาลัย) ระบบรับฟังเสียงนักเรียนและแจ้งเรื่องสู่สภานักเรียน โรงเรียนพิริยาลัยจังหวัดแพร่ — นักเรียนแจ้งเรื่อง แล้วไต่ระดับการแก้ไขตามสายงาน: หัวหน้าห้อง → ประธานระดับ → สภานักเรียน/ประธานสภา">
    <meta name="keywords" content="PIRIvoice, Pirivoice, เสียงจากชาวพิริยาลัย, ระบบแจ้งเรื่องนักเรียน, ระบบรับฟังเสียงนักเรียน, สภานักเรียน, พิริยาลัย, พิริยาลัยจังหวัดแพร่, แจ้งเรื่อง, แจ้งเรื่องโรงเรียน, ข้อเสนอแนะ, ความคิดเห็น, พรส, PRSC, piriyalai, สภานักเรียนพิริยาลัย, แจ้งเรื่องร้องเรียน, เสียงชาวพิริยาลัย">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="author" content="พัฒนพล สุธรรม">
    <meta name="theme-color" content="#b91c1c">
    <link rel="canonical" href="https://www.pirivoice.com/">

    <!-- 📱 PWA (A1) — ติดตั้งลงหน้าจอมือถือได้
         ⚠️ `manifest.json` + `sw.js` ต้องไม่ถูก cache โดย nginx (ดู frontend/Dockerfile)
            ไม่งั้นอัปเดต service worker รอบหน้าจะไม่มีผลบนเครื่องที่ติดตั้งไปแล้ว -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PIRIvoice">

    <!-- Open Graph (แชร์ลิงก์ให้เห็นชื่อ/คำอธิบายบนโซเชียล) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PIRIvoice">
    <meta property="og:title" content="PIRIvoice — เสียงจากชาวพิริยาลัย">
    <meta property="og:description" content="ระบบแจ้งเรื่องของนักเรียนสู่สภานักเรียน พิริยาลัยจังหวัดแพร่ — แจ้งเรื่องแล้วระบบไต่ระดับการแก้ไขตามสายงานอย่างโปร่งใส">
    <meta property="og:url" content="https://www.pirivoice.com/">
    <meta property="og:image" content="https://www.pirivoice.com/logos/school-logo.png">
    <meta property="og:locale" content="th_TH">

    <!-- Twitter Card -->

    <meta name="twitter:title" content="PIRIvoice — เสียงจากชาวพิริยาลัย">
    <meta name="twitter:description" content="ระบบแจ้งเรื่องของนักเรียนสู่สภานักเรียน พิริยาลัยจังหวัดแพร่">
    <meta name="twitter:image" content="https://www.pirivoice.com/logos/school-logo.png">
